<text x="90.0" y="535.0" font-size="10" fill="#898781" text-anchor="start" font-weight="400">，两段区间重叠，不是变便宜了；超过 26k 自动建原文树，回到 G 一档（$0.037 对 $0.042）。G 的曲线用第 1 次盲测，和第 2 次 G&#x27; 臂（OP28 行为）逐段相差</text>
<text x="90.0" y="548.0" font-size="10" fill="#898781" text-anchor="start" font-weight="400">0.72–1.08 倍。虚线是外推：从 &gt;26k 段的实测连到 10-22 一次 50 万字符合成长文的实测（按只算输入折为约 $0.24），只说明量级。</text>

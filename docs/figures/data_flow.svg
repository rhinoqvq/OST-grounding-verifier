<text x="218.04000000000002" y="64" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="start">gpt-6.1-sol call</text>
<rect x="24" y="114" width="116" height="388" rx="8" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="82.0" y="286.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">Input</text>
<text x="82.0" y="310.0" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">context_passages</text>
<text x="82.0" y="328.0" font-size="10.5" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">generated_answer</text>
<rect x="804" y="114" width="132" height="388" rx="8" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="870.0" y="212.0" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">Response contract</text>
<text x="870.0" y="230.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">(code, all methods)</text>
<text x="870.0" y="256.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">index in range</text>
<text x="870.0" y="274.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">quote verbatim</text>
<text x="870.0" y="292.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">S/C need a citation,</text>
<text x="870.0" y="310.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">else → U</text>
<text x="870.0" y="328.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">U has no citation</text>
<text x="870.0" y="354.0" font-size="11.5" fill="#52514e" font-weight="400" text-anchor="middle">↓</text>
<text x="870.0" y="380.0" font-size="11.5" fill="#0b0b0b" font-weight="600" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">claims[]</text>
<text x="160" y="106" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">baseline</text>
<text x="230.0" y="106" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">no model call</text>
<line x1="140" y1="152.0" x2="159" y2="152.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160.0" y="114" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="257.3333333333333" y="148.5" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">Split the answer:</text>
<text x="257.3333333333333" y="163.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">one claim per sentence</text>
<line x1="354.66666666666663" y1="152.0" x2="373.66666666666663" y2="152.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="374.7" y="114" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="471.99999999999994" y="141.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">BM25 picks the closest</text>
<text x="471.99999999999994" y="156.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">source sentence</text>
<text x="471.99999999999994" y="171.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">as the citation</text>
<line x1="569.3333333333333" y1="152.0" x2="588.3333333333333" y2="152.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="589.3" y="114" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="686.6666666666666" y="141.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">low word overlap → U</text>
<text x="686.6666666666666" y="156.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">number or negation</text>
<text x="686.6666666666666" y="171.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">clash → C, else → S</text>
<line x1="784" y1="152.0" x2="803" y2="152.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="160" y="210" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">minimal_llm (gpt-6.1-sol)</text>
<text x="353.25" y="210" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">1 request per answer</text>
<line x1="140" y1="256.0" x2="159" y2="256.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160.0" y="218" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="257.3333333333333" y="245.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">One request: all passages</text>
<text x="257.3333333333333" y="260.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">+ the whole answer</text>
<text x="257.3333333333333" y="275.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">+ three verdict definitions</text>
<line x1="354.66666666666663" y1="256.0" x2="373.66666666666663" y2="256.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="374.7" y="218" width="194.7" height="76" rx="6" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
<text x="471.99999999999994" y="245.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">gpt-6.1-sol, in one call:</text>
<text x="471.99999999999994" y="260.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">splits, judges and</text>
<text x="471.99999999999994" y="275.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">writes citations (JSON)</text>
<line x1="569.3333333333333" y1="256.0" x2="588.3333333333333" y2="256.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="589.3" y="218" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="686.6666666666666" y="245.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">Parse the JSON;</text>
<text x="686.6666666666666" y="260.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">one repair round</text>
<text x="686.6666666666666" y="275.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">if the format is off</text>
<line x1="784" y1="256.0" x2="803" y2="256.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="160" y="314" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">minimal_llm (jev)</text>
<text x="295.25" y="314" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">1 Jev request per answer</text>
<line x1="140" y1="360.0" x2="159" y2="360.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160.0" y="322" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="257.3333333333333" y="349.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">One request: numbered</text>
<text x="257.3333333333333" y="364.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">passages + the whole answer;</text>
<text x="257.3333333333333" y="379.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">too large → error</text>
<line x1="354.66666666666663" y1="360.0" x2="373.66666666666663" y2="360.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="374.7" y="322" width="194.7" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="471.99999999999994" y="349.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">Two choice questions:</text>
<text x="471.99999999999994" y="364.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">verdict (three definitions),</text>
<text x="471.99999999999994" y="379.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">which passage is evidence</text>
<line x1="569.3333333333333" y1="360.0" x2="588.3333333333333" y2="360.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="589.3" y="322" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="686.6666666666666" y="349.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">Whole answer = one claim;</text>
<text x="686.6666666666666" y="364.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">the chosen passage is</text>
<text x="686.6666666666666" y="379.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">cut out as the citation</text>
<line x1="784" y1="360.0" x2="803" y2="360.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="160" y="418" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">OST (OP29)</text>
<text x="244.5" y="418" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">several Jev requests per answer, about 5 on the dev set</text>
<line x1="140" y1="464.0" x2="159" y2="464.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160.0" y="426" width="141.0" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="230.5" y="445.5" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">Split the answer:</text>
<text x="230.5" y="460.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">code proposes cuts,</text>
<text x="230.5" y="475.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">Jev decides each;</text>
<text x="230.5" y="490.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">meta-discourse gate</text>
<line x1="301.0" y1="464.0" x2="320.0" y2="464.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="321.0" y="426" width="141.0" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="391.5" y="445.5" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">Judge each sentence</text>
<text x="391.5" y="460.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">against the whole source;</text>
<text x="391.5" y="475.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">S with evidence settles</text>
<text x="391.5" y="490.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">all its claims</text>
<line x1="462.0" y1="464.0" x2="481.0" y2="464.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="482.0" y="426" width="141.0" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="552.5" y="445.5" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">The rest, claim by claim:</text>
<text x="552.5" y="460.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">evidence, verdict,</text>
<text x="552.5" y="475.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">contradiction, relations;</text>
<text x="552.5" y="490.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">long source → source tree</text>
<line x1="623.0" y1="464.0" x2="642.0" y2="464.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="643.0" y="426" width="141.0" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="713.5" y="445.5" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">Sentence guard:</text>
<text x="713.5" y="460.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">withdraws structural</text>
<text x="713.5" y="475.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">alarms; code cuts quotes</text>
<text x="713.5" y="490.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">by character offset</text>
<line x1="784" y1="464.0" x2="803" y2="464.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516" width="960" height="516" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#898781"/></marker></defs>
<rect width="960" height="516" fill="#fcfcfb"/>
<rect x="24" y="18" width="4" height="20" rx="2" fill="#2a78d6"/>

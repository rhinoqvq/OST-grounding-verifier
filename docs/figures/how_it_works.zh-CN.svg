<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 556" width="960" height="556">
<style>svg{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}@keyframes g1{0%{stroke-dashoffset:228}0.01%{stroke-dashoffset:228}25.00%{stroke-dashoffset:0}99.50%{stroke-dashoffset:0}100%{stroke-dashoffset:228}}.g1{stroke-dasharray:228 228;stroke-dashoffset:228;animation:g1 36s linear infinite}@keyframes k1{0%{opacity:0}0.01%{opacity:0}2.00%{opacity:1}23.50%{opacity:1}25.00%{opacity:0}100%{opacity:0}}.k1{opacity:0;animation:k1 36s infinite}@keyframes p1{0%{opacity:0}0.01%{opacity:0}2.00%{opacity:1}98%{opacity:1}100%{opacity:0}}.p1{opacity:0;animation:p1 36s infinite}@keyframes h1{0%{fill:#efeee9}0.01%{fill:#efeee9}1.00%{fill:#2a78d6}24.00%{fill:#2a78d6}25.00%{fill:#efeee9}100%{fill:#efeee9}}.h1{animation:h1 36s infinite}@keyframes t1{0%{fill:#52514e}0.01%{fill:#52514e}1.00%{fill:#ffffff}24.00%{fill:#ffffff}25.00%{fill:#52514e}100%{fill:#52514e}}.t1{animation:t1 36s infinite}@keyframes g2{0%{stroke-dashoffset:228}25.00%{stroke-dashoffset:228}50.00%{stroke-dashoffset:0}99.50%{stroke-dashoffset:0}100%{stroke-dashoffset:228}}.g2{stroke-dasharray:228 228;stroke-dashoffset:228;animation:g2 36s linear infinite}@keyframes k2{0%{opacity:0}25.00%{opacity:0}27.00%{opacity:1}48.50%{opacity:1}50.00%{opacity:0}100%{opacity:0}}.k2{opacity:0;animation:k2 36s infinite}@keyframes p2{0%{opacity:0}25.00%{opacity:0}27.00%{opacity:1}98%{opacity:1}100%{opacity:0}}.p2{opacity:0;animation:p2 36s infinite}@keyframes h2{0%{fill:#efeee9}25.00%{fill:#efeee9}26.00%{fill:#2a78d6}49.00%{fill:#2a78d6}50.00%{fill:#efeee9}100%{fill:#efeee9}}.h2{animation:h2 36s infinite}@keyframes t2{0%{fill:#52514e}25.00%{fill:#52514e}26.00%{fill:#ffffff}49.00%{fill:#ffffff}50.00%{fill:#52514e}100%{fill:#52514e}}.t2{animation:t2 36s infinite}@keyframes g3{0%{stroke-dashoffset:228}50.00%{stroke-dashoffset:228}75.00%{stroke-dashoffset:0}99.50%{stroke-dashoffset:0}100%{stroke-dashoffset:228}}.g3{stroke-dasharray:228 228;stroke-dashoffset:228;animation:g3 36s linear infinite}@keyframes k3{0%{opacity:0}50.00%{opacity:0}52.00%{opacity:1}73.50%{opacity:1}75.00%{opacity:0}100%{opacity:0}}.k3{opacity:0;animation:k3 36s infinite}@keyframes p3{0%{opacity:0}50.00%{opacity:0}52.00%{opacity:1}98%{opacity:1}100%{opacity:0}}.p3{opacity:0;animation:p3 36s infinite}@keyframes h3{0%{fill:#efeee9}50.00%{fill:#efeee9}51.00%{fill:#2a78d6}74.00%{fill:#2a78d6}75.00%{fill:#efeee9}100%{fill:#efeee9}}.h3{animation:h3 36s infinite}@keyframes t3{0%{fill:#52514e}50.00%{fill:#52514e}51.00%{fill:#ffffff}74.00%{fill:#ffffff}75.00%{fill:#52514e}100%{fill:#52514e}}.t3{animation:t3 36s infinite}@keyframes g4{0%{stroke-dashoffset:228}75.00%{stroke-dashoffset:228}98.00%{stroke-dashoffset:0}99.50%{stroke-dashoffset:0}100%{stroke-dashoffset:228}}.g4{stroke-dasharray:228 228;stroke-dashoffset:228;animation:g4 36s linear infinite}@keyframes k4{0%{opacity:0}75.00%{opacity:0}77.00%{opacity:1}98.50%{opacity:1}100.00%{opacity:0}100%{opacity:0}}.k4{opacity:0;animation:k4 36s infinite}@keyframes p4{0%{opacity:0}75.00%{opacity:0}77.00%{opacity:1}98%{opacity:1}100%{opacity:0}}.p4{opacity:0;animation:p4 36s infinite}@keyframes h4{0%{fill:#efeee9}75.00%{fill:#efeee9}76.00%{fill:#2a78d6}99.00%{fill:#2a78d6}100.00%{fill:#efeee9}100%{fill:#efeee9}}.h4{animation:h4 36s infinite}@keyframes t4{0%{fill:#52514e}75.00%{fill:#52514e}76.00%{fill:#ffffff}99.00%{fill:#ffffff}100.00%{fill:#52514e}100%{fill:#52514e}}.t4{animation:t4 36s infinite}@media (prefers-reduced-motion: reduce){.k1,.k2,.k3,.k4,.p1,.p2,.p3,.p4{animation:none;opacity:1}.g1,.g2,.g3,.g4{animation:none;stroke-dashoffset:0}}</style>
<rect width="960" height="556" fill="#fcfcfb"/>
<rect x="24" y="18" width="4" height="20" rx="2" fill="#2a78d6"/>
<text x="36" y="33" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="start">OST（OP29）怎么判一条回答：SQLite WAL 例子</text>
<rect x="24" y="54" width="228" height="28" rx="6" class="h1" fill="#efeee9"/>
<text x="36" y="73" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" class="t1">1  拆回答</text>
<line x1="24" y1="90" x2="252" y2="90" stroke="#e4e3dc" stroke-width="4"/>
<line class="g1" x1="24" y1="90" x2="252" y2="90" stroke="#2a78d6" stroke-width="4"/>
<rect x="258" y="54" width="228" height="28" rx="6" class="h2" fill="#efeee9"/>
<text x="270" y="73" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" class="t2">2  先按句判定</text>
<line x1="258" y1="90" x2="486" y2="90" stroke="#e4e3dc" stroke-width="4"/>
<line class="g2" x1="258" y1="90" x2="486" y2="90" stroke="#2a78d6" stroke-width="4"/>
<rect x="492" y="54" width="228" height="28" rx="6" class="h3" fill="#efeee9"/>
<text x="504" y="73" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" class="t3">3  其余的逐条判定</text>
<line x1="492" y1="90" x2="720" y2="90" stroke="#e4e3dc" stroke-width="4"/>
<line class="g3" x1="492" y1="90" x2="720" y2="90" stroke="#2a78d6" stroke-width="4"/>
<rect x="726" y="54" width="228" height="28" rx="6" class="h4" fill="#efeee9"/>
<text x="738" y="73" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" class="t4">4  切引文、过响应约束</text>
<line x1="726" y1="90" x2="954" y2="90" stroke="#e4e3dc" stroke-width="4"/>
<line class="g4" x1="726" y1="90" x2="954" y2="90" stroke="#2a78d6" stroke-width="4"/>
<text x="24" y="112" font-size="13" fill="#52514e" font-weight="600" text-anchor="start">原文段落</text>
<rect x="24" y="124" width="436" height="30" rx="5" fill="#ffffff" stroke="#d9d8d1"/>
<text x="34" y="143" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">P0.S0</text>
<text x="84" y="143" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">Beginning with version 3.7.0, WAL mode is available.</text>
<rect x="24" y="160" width="436" height="30" rx="5" fill="#ffffff" stroke="#d9d8d1"/>
<text x="34" y="179" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">P0.S1</text>
<text x="84" y="179" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">… readers do not block writers and writers do not block readers.</text>
<rect x="24" y="196" width="436" height="30" rx="5" fill="#ffffff" stroke="#d9d8d1"/>
<text x="34" y="215" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">P0.S2</text>
<text x="84" y="215" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">However, WAL does not work over a network filesystem …</text>
<rect x="24" y="242" width="436" height="30" rx="5" fill="#ffffff" stroke="#d9d8d1"/>
<text x="34" y="261" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">P1.S0</text>
<text x="84" y="261" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">When in active use, … described by three separate files …</text>
<rect x="24" y="278" width="436" height="30" rx="5" fill="#ffffff" stroke="#d9d8d1"/>
<text x="34" y="297" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">P1.S1</text>
<text x="84" y="297" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">Automatic checkpointing occurs … approximately 1000 pages.</text>
<text x="500" y="112" font-size="13" fill="#52514e" font-weight="600" text-anchor="start">回答</text>
<rect x="500" y="124" width="436" height="48" rx="5" fill="#ffffff" stroke="#d9d8d1"/>
<text x="510" y="144" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">A1</text>
<text x="540" y="144" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">SQLite WAL mode allows multiple processes across different</text>
<text x="540" y="160" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">host machines on an NFS network share to write concurrently.</text>
<rect x="500" y="180" width="436" height="64" rx="5" fill="#ffffff" stroke="#d9d8d1"/>
<text x="510" y="200" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">A2</text>
<text x="540" y="200" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">Alongside the main database file, it uses two auxiliary files</text>
<text x="540" y="216" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">(-wal and -shm) and automatically checkpoints when the log</text>
<text x="540" y="232" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">reaches roughly 1,000 pages.</text>
<rect x="500" y="252" width="436" height="32" rx="5" fill="#ffffff" stroke="#d9d8d1"/>
<text x="510" y="272" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">A3</text>
<text x="540" y="272" font-size="11.5" fill="#0b0b0b" font-weight="400" text-anchor="start">By default, WAL files are encrypted with AES-256 at rest.</text>
<g class="p2"><rect x="906" y="130" width="22" height="20" rx="4" fill="#e34948"/><text x="917" y="144" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">C</text></g>
<g class="p2"><rect x="906" y="186" width="22" height="20" rx="4" fill="#008300"/><text x="917" y="200" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">S</text></g>
<g class="p2"><rect x="906" y="258" width="22" height="20" rx="4" fill="#c98a00"/><text x="917" y="272" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">U</text></g>
<path class="p2" d="M500 148 C 480 148, 480 211, 460 211" fill="none" stroke="#e34948" stroke-width="2"/>
<path class="p2" d="M500 212 C 480 212, 480 257, 460 257" fill="none" stroke="#008300" stroke-width="2"/>
<rect x="24" y="338" width="912" height="202" rx="8" fill="#f4f3ee"/>
<g class="k1"><text x="44" y="368" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">Jev 只看回答。代码提出候选切点，Jev 判断每个属于哪一类：</text><text x="44" y="398" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">「-wal and -shm」→ 不是边界 0.48</text><text x="44" y="428" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">「… and automatically …」→ 两件事 0.82</text><text x="44" y="458" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">「when the log reaches …」→ 整句保留 0.81（条件）</text><text x="44" y="488" font-size="12.5" fill="#6250d6" font-weight="400" text-anchor="start">句子里有条件：整句保留，撤回这句的其他切分。</text><text x="44" y="518" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">元话语门：三句都是事实陈述。</text></g>
<g class="k2"><text x="44" y="368" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">每一句向 Jev 问一次，对照整份原文：</text><text x="44" y="398" font-size="12.5" fill="#008300" font-weight="400" text-anchor="start">A2 判为支持且有证据 → 直接定为 S，跳过第 3 步。</text></g>
<g class="k3"><text x="44" y="368" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">只有还没定下来的 A1、A3 走这一步：</text><text x="44" y="398" font-size="12.5" fill="#e34948" font-weight="400" text-anchor="start">A1：P0.S2 是证据（0.78）；反驳过滤：它明确排除了 A1 → C</text><text x="44" y="428" font-size="12.5" fill="#c98a00" font-weight="400" text-anchor="start">A3：原文没有 → U，不带引文</text></g>
<g class="k4"><text x="44" y="368" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">引文由代码按字符偏移从原文切出：</text><text x="44" y="398" font-size="12.5" fill="#e34948" font-weight="400" text-anchor="start">A1  C  [0]「However, WAL does not work over a network filesystem …」</text><text x="44" y="428" font-size="12.5" fill="#008300" font-weight="400" text-anchor="start">A2  S  [1]「When in active use, the state of a WAL mode database …」</text><text x="44" y="458" font-size="12.5" fill="#c98a00" font-weight="400" text-anchor="start">A3  U  []</text><text x="44" y="488" font-size="12.5" fill="#2a78d6" font-weight="400" text-anchor="start">响应约束：段号不越界 ✓  引文逐字 ✓  S/C 有引文 ✓  U 无引文 ✓</text><text x="44" y="518" font-size="12.5" fill="#898781" font-weight="400" text-anchor="start">5 次 Jev 请求 · 7,986 输入 token · $0.0003</text></g>
<rect class="k1" x="498" y="178" width="440" height="68" rx="6" fill="none" stroke="#6250d6" stroke-width="2" stroke-dasharray="6 4"/>
<rect class="k2" x="498" y="178" width="440" height="68" rx="6" fill="none" stroke="#008300" stroke-width="2.5"/>
<rect class="k3" x="498" y="122" width="440" height="52" rx="6" fill="none" stroke="#e34948" stroke-width="2.5"/>
<rect class="k3" x="498" y="250" width="440" height="36" rx="6" fill="none" stroke="#c98a00" stroke-width="2.5"/>
<rect class="k3" x="22" y="194" width="440" height="34" rx="6" fill="none" stroke="#e34948" stroke-width="2.5"/>
<rect class="k4" x="22" y="194" width="440" height="34" rx="6" fill="none" stroke="#2a78d6" stroke-width="2.5"/>
<rect class="k4" x="22" y="240" width="440" height="34" rx="6" fill="none" stroke="#2a78d6" stroke-width="2.5"/>
</svg>
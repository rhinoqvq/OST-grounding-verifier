<style>svg{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}@keyframes k1{0%{opacity:0}0.01%{opacity:0}1.50%{opacity:1}18.80%{opacity:1}20.00%{opacity:0}100%{opacity:0}}.k1{opacity:0;animation:k1 22s infinite}@keyframes p1{0%{opacity:0}0.01%{opacity:0}1.50%{opacity:1}98%{opacity:1}100%{opacity:0}}.p1{opacity:0;animation:p1 22s infinite}@keyframes h1{0%{fill:#efeee9}0.01%{fill:#efeee9}0.80%{fill:#2a78d6}19.20%{fill:#2a78d6}20.00%{fill:#efeee9}100%{fill:#efeee9}}.h1{animation:h1 22s infinite}@keyframes t1{0%{fill:#52514e}0.01%{fill:#52514e}0.80%{fill:#ffffff}19.20%{fill:#ffffff}20.00%{fill:#52514e}100%{fill:#52514e}}.t1{animation:t1 22s infinite}@keyframes k2{0%{opacity:0}20.00%{opacity:0}21.50%{opacity:1}38.80%{opacity:1}40.00%{opacity:0}100%{opacity:0}}.k2{opacity:0;animation:k2 22s infinite}@keyframes p2{0%{opacity:0}20.00%{opacity:0}21.50%{opacity:1}98%{opacity:1}100%{opacity:0}}.p2{opacity:0;animation:p2 22s infinite}@keyframes h2{0%{fill:#efeee9}20.00%{fill:#efeee9}20.80%{fill:#2a78d6}39.20%{fill:#2a78d6}40.00%{fill:#efeee9}100%{fill:#efeee9}}.h2{animation:h2 22s infinite}@keyframes t2{0%{fill:#52514e}20.00%{fill:#52514e}20.80%{fill:#ffffff}39.20%{fill:#ffffff}40.00%{fill:#52514e}100%{fill:#52514e}}.t2{animation:t2 22s infinite}@keyframes k3{0%{opacity:0}40.00%{opacity:0}41.50%{opacity:1}58.80%{opacity:1}60.00%{opacity:0}100%{opacity:0}}.k3{opacity:0;animation:k3 22s infinite}@keyframes p3{0%{opacity:0}40.00%{opacity:0}41.50%{opacity:1}98%{opacity:1}100%{opacity:0}}.p3{opacity:0;animation:p3 22s infinite}@keyframes h3{0%{fill:#efeee9}40.00%{fill:#efeee9}40.80%{fill:#2a78d6}59.20%{fill:#2a78d6}60.00%{fill:#efeee9}100%{fill:#efeee9}}.h3{animation:h3 22s infinite}@keyframes t3{0%{fill:#52514e}40.00%{fill:#52514e}40.80%{fill:#ffffff}59.20%{fill:#ffffff}60.00%{fill:#52514e}100%{fill:#52514e}}.t3{animation:t3 22s infinite}@keyframes k4{0%{opacity:0}60.00%{opacity:0}61.50%{opacity:1}78.80%{opacity:1}80.00%{opacity:0}100%{opacity:0}}.k4{opacity:0;animation:k4 22s infinite}@keyframes p4{0%{opacity:0}60.00%{opacity:0}61.50%{opacity:1}98%{opacity:1}100%{opacity:0}}.p4{opacity:0;animation:p4 22s infinite}@keyframes h4{0%{fill:#efeee9}60.00%{fill:#efeee9}60.80%{fill:#2a78d6}79.20%{fill:#2a78d6}80.00%{fill:#efeee9}100%{fill:#efeee9}}.h4{animation:h4 22s infinite}@keyframes t4{0%{fill:#52514e}60.00%{fill:#52514e}60.80%{fill:#ffffff}79.20%{fill:#ffffff}80.00%{fill:#52514e}100%{fill:#52514e}}.t4{animation:t4 22s infinite}@keyframes k5{0%{opacity:0}80.00%{opacity:0}81.50%{opacity:1}98.80%{opacity:1}100.00%{opacity:0}100%{opacity:0}}.k5{opacity:0;animation:k5 22s infinite}@keyframes p5{0%{opacity:0}80.00%{opacity:0}81.50%{opacity:1}98%{opacity:1}100%{opacity:0}}.p5{opacity:0;animation:p5 22s infinite}@keyframes h5{0%{fill:#efeee9}80.00%{fill:#efeee9}80.80%{fill:#2a78d6}99.20%{fill:#2a78d6}100.00%{fill:#efeee9}100%{fill:#efeee9}}.h5{animation:h5 22s infinite}@keyframes t5{0%{fill:#52514e}80.00%{fill:#52514e}80.80%{fill:#ffffff}99.20%{fill:#ffffff}100.00%{fill:#52514e}100%{fill:#52514e}}.t5{animation:t5 22s infinite}@keyframes cut{0%{fill:#0b0b0b}1%{fill:#6250d6}39.00%{fill:#6250d6}40.00%{fill:#0b0b0b}100%{fill:#0b0b0b}}.cut{animation:cut 22s infinite;font-weight:700}@keyframes sg{0%{fill:#0b0b0b}80.00%{fill:#0b0b0b}81.50%{fill:#008300}98%{fill:#008300}100%{fill:#0b0b0b}}.sg{animation:sg 22s infinite}@keyframes su{0%{fill:#0b0b0b}80.00%{fill:#0b0b0b}81.50%{fill:#c98a00}98%{fill:#c98a00}100%{fill:#0b0b0b}}.su{animation:su 22s infinite}@media (prefers-reduced-motion: reduce){.k1,.k2,.k3,.k4,.k5,.p1,.p2,.p3,.p4,.p5{animation:none;opacity:1}}</style>
<rect width="960" height="600" fill="#fcfcfb"/>
<rect x="24" y="18" width="4" height="20" rx="2" fill="#2a78d6"/>
<text x="36" y="33" font-size="16" fill="#0b0b0b" font-weight="600" text-anchor="start">语义树：一句话怎么拆、怎么建树、怎么判</text>
<text x="36" y="52" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">附带测评集第 15 题，回答第 2 句，OP29 实跑</text>
<rect x="24.0" y="64" width="178" height="28" rx="6" class="h1" fill="#efeee9"/>
<text x="34.0" y="83" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" class="t1">1 找切点</text>
<rect x="207.5" y="64" width="178" height="28" rx="6" class="h2" fill="#efeee9"/>
<text x="217.5" y="83" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" class="t2">2 Jev 判类别</text>
<rect x="391.0" y="64" width="178" height="28" rx="6" class="h3" fill="#efeee9"/>
<text x="401.0" y="83" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" class="t3">3 建树</text>
<rect x="574.5" y="64" width="178" height="28" rx="6" class="h4" fill="#efeee9"/>
<text x="584.5" y="83" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" class="t4">4 先按句判定</text>
<rect x="758.0" y="64" width="178" height="28" rx="6" class="h5" fill="#efeee9"/>
<text x="768.0" y="83" font-size="12.5" fill="#52514e" font-weight="600" text-anchor="start" class="t5">5 逐条判、往上汇总</text>
<rect x="24" y="104" width="912" height="56" rx="6" fill="#ffffff" stroke="#d9d8d1"/>
<text x="34" y="124" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">A2</text>
<text x="64" y="124" font-size="13" fill="#0b0b0b"><tspan class="sg">He had suffered a nervous breakdown in 1936</tspan> <tspan class="cut">and</tspan> <tspan class="su">was increasingly plagued by arthritis, making it difficult for him to</tspan></text>
<text x="64" y="146" font-size="13" fill="#0b0b0b"><tspan class="su">carry out his duties effectively.</tspan></text>
<g class="k1"><rect x="22" y="102" width="916" height="60" rx="7" fill="none" stroke="#6250d6" stroke-width="2" stroke-dasharray="6 4"/></g>
<g class="p3"><rect x="330" y="196" width="300" height="40" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/><text x="480.0" y="221" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="middle">A2  整句</text></g>
<g class="p3"><path d="M440.0 236 C 440.0 266, 240.0 260, 240.0 290" fill="none" stroke="#52514e" stroke-width="1.5"/><path d="M520.0 236 C 520.0 266, 695.0 260, 695.0 290" fill="none" stroke="#52514e" stroke-width="1.5"/></g>
<g class="p3"><rect x="40" y="290" width="400" height="58" rx="6" fill="#ffffff" stroke="#d9d8d1"/><text x="50" y="310" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">claim 1   [87, 130)</text><text x="50" y="332" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start">He had suffered a nervous breakdown in 1936</text></g>
<g class="p3"><rect x="470" y="290" width="450" height="74" rx="6" fill="#ffffff" stroke="#d9d8d1"/><text x="480" y="310" font-size="11" fill="#898781" font-weight="600" text-anchor="start" font-family="ui-monospace,Consolas,monospace">claim 2   [87, 89) + [135, 238)</text><text x="480" y="332" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start">He … was increasingly plagued by arthritis, making it</text><text x="480" y="350" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start">difficult for him to carry out his duties effectively.</text></g>
<g class="k4"><rect x="328" y="194" width="304" height="44" rx="7" fill="none" stroke="#c98a00" stroke-width="2.5"/><rect x="566" y="205" width="56" height="22" rx="4" fill="#c98a00"/><text x="594" y="220" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle">U 0.68</text></g>
<g class="p5"><rect x="406" y="298" width="24" height="22" rx="4" fill="#008300"/><text x="418" y="314" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">S</text><rect x="886" y="298" width="24" height="22" rx="4" fill="#c98a00"/><text x="898" y="314" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">U</text><rect x="596" y="205" width="24" height="22" rx="4" fill="#c98a00"/><text x="608" y="221" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">U</text></g>
<g class="k5"><rect x="38" y="288" width="404" height="62" rx="7" fill="none" stroke="#008300" stroke-width="2.5"/><rect x="468" y="288" width="454" height="78" rx="7" fill="none" stroke="#c98a00" stroke-width="2.5"/></g>
<g class="k3"><rect x="38" y="288" width="884" height="78" rx="8" fill="none" stroke="#6250d6" stroke-width="2" stroke-dasharray="6 4"/></g>
<rect x="24" y="390" width="912" height="190" rx="8" fill="#f4f3ee"/>
<g class="k1"><text x="44" y="420" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">代码在连接词处提出候选切点，这一句只有一个：and。</text><text x="44" y="450" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">这一步 Jev 只看回答，不看原文。</text></g>
<g class="k2"><text x="44" y="420" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">Jev 回答一道关于这个切点的选择题：</text><text x="44" y="450" font-size="12.5" fill="#6250d6" font-weight="400" text-anchor="start">共享开头后拆开   0.78</text><text x="44" y="476" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">两件独立的事   0.18</text><text x="44" y="502" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">不是边界   0.04</text><text x="44" y="532" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start">→ 拆开，第二条补上共享的开头「He」。</text><rect x="420" y="440" width="234" height="12" rx="3" fill="#6250d6"/><rect x="420" y="466" width="54" height="12" rx="3" fill="#c9c7bf"/><rect x="420" y="492" width="12" height="12" rx="3" fill="#c9c7bf"/></g>
<g class="k3"><text x="44" y="420" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">整句是根，两条 claim 是它的子节点，都指向回答里的字符偏移。</text><text x="44" y="450" font-size="12.5" fill="#6250d6" font-weight="400" text-anchor="start">拼回检查：两条合起来还是原句的意思吗？是 0.95 ✓</text><text x="44" y="480" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">元话语门：是事实陈述 ✓</text></g>
<g class="k4"><text x="44" y="420" font-size="13" fill="#0b0b0b" font-weight="600" text-anchor="start">整句向 Jev 问一次，对照整份原文：</text><text x="44" y="450" font-size="12.5" fill="#c98a00" font-weight="400" text-anchor="start">UNSUPPORTED 0.68，不是 S，所以它的 claim 往下逐条判。</text></g>
<g class="k5"><text x="44" y="420" font-size="13" fill="#008300" font-weight="600" text-anchor="start">claim 1：支持 0.76；证据 P0.S342（相关度 0.96）→ S</text><text x="44" y="450" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">   「… as shown by his nervous breakdown in 1936 that kept him out of action …」</text><text x="44" y="480" font-size="12.5" fill="#c98a00" font-weight="600" text-anchor="start">claim 2：原文没有 0.74；没有一句原文相关度过 0.60（最高 0.27）→ U</text><text x="44" y="510" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start">往上汇总取最严重的（S &lt; U &lt; C）：整句是 U，</text><text x="44" y="540" font-size="12.5" fill="#0b0b0b" font-weight="400" text-anchor="start">报警只落在后半句。</text></g>
</svg>
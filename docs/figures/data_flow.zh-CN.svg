<text x="686.6666666666666" y="156.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">数字或否定对不上 → C</text>
<text x="686.6666666666666" y="171.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">其余 → S</text>

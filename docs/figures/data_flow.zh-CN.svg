<rect x="160.0" y="322" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="257.3333333333333" y="349.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">拼一个请求：原文按段</text>
<text x="257.3333333333333" y="364.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">编号 + 整段回答；</text>
<text x="257.3333333333333" y="379.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">放不下就报错</text>
<line x1="354.66666666666663" y1="360.0" x2="373.66666666666663" y2="360.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="374.7" y="322" width="194.7" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="471.99999999999994" y="349.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">Jev 两道选择题：</text>
<text x="471.99999999999994" y="364.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">判定（三条定义）、</text>
<text x="471.99999999999994" y="379.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">哪一段是证据</text>
<line x1="569.3333333333333" y1="360.0" x2="588.3333333333333" y2="360.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="589.3" y="322" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="686.6666666666666" y="349.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">整段回答 = 一条 claim；</text>
<text x="686.6666666666666" y="364.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">按段号把整段</text>
<text x="686.6666666666666" y="379.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">切出来当引文</text>
<line x1="784" y1="360.0" x2="803" y2="360.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="160" y="418" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">OST（OP29）</text>
<text x="247.75" y="418" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">每条回答多次 Jev 请求，开发集上平均约 5 次</text>
<line x1="140" y1="464.0" x2="159" y2="464.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160.0" y="426" width="141.0" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="230.5" y="445.5" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">拆回答：</text>
<text x="230.5" y="460.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">代码找切点，</text>
<text x="230.5" y="475.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">Jev 判切不切；</text>
<text x="230.5" y="490.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">元话语门</text>
<line x1="301.0" y1="464.0" x2="320.0" y2="464.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="321.0" y="426" width="141.0" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="391.5" y="445.5" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">先按句判定：</text>
<text x="391.5" y="460.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">每句对照整份原文；</text>
<text x="391.5" y="475.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">有证据的 S</text>
<text x="391.5" y="490.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">整句的 claim 都定 S</text>
<line x1="462.0" y1="464.0" x2="481.0" y2="464.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="482.0" y="426" width="141.0" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="552.5" y="445.5" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">其余 claim 逐条判定：</text>
<text x="552.5" y="460.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">找证据、判定、</text>
<text x="552.5" y="475.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">对立过滤、关系核对；</text>
<text x="552.5" y="490.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">长原文先建原文树</text>
<line x1="623.0" y1="464.0" x2="642.0" y2="464.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="643.0" y="426" width="141.0" height="76" rx="6" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="713.5" y="445.5" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">整句护栏：</text>
<text x="713.5" y="460.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">撤回结构层的误报；</text>
<text x="713.5" y="475.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">代码按字符偏移</text>
<text x="713.5" y="490.5" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">切出引文</text>
<line x1="784" y1="464.0" x2="803" y2="464.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>

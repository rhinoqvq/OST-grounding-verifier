<text x="160" y="210" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="start">minimal_llm（gpt-6.1-sol）</text>
<text x="356.5" y="210" font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">每条回答 1 次请求</text>
<line x1="140" y1="256.0" x2="159" y2="256.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="160.0" y="218" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="257.3333333333333" y="245.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">拼一个请求：全部原文</text>
<text x="257.3333333333333" y="260.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">+ 整段回答</text>
<text x="257.3333333333333" y="275.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">+ 三条判定定义</text>
<line x1="354.66666666666663" y1="256.0" x2="373.66666666666663" y2="256.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="374.7" y="218" width="194.7" height="76" rx="6" fill="#efedfb" stroke="#6250d6" stroke-width="1.5"/>
<text x="471.99999999999994" y="245.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">gpt-6.1-sol 一次完成：</text>
<text x="471.99999999999994" y="260.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">拆 claim、判定、写引文</text>
<text x="471.99999999999994" y="275.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">（JSON 输出）</text>
<line x1="569.3333333333333" y1="256.0" x2="588.3333333333333" y2="256.0" stroke="#898781" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="589.3" y="218" width="194.7" height="76" rx="6" fill="#ffffff" stroke="#d9d8d1" stroke-width="1.5"/>
<text x="686.6666666666666" y="245.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">解析 JSON；</text>
<text x="686.6666666666666" y="260.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">格式不对就修复</text>
<text x="686.6666666666666" y="275.0" font-size="11" fill="#0b0b0b" font-weight="400" text-anchor="middle">重试一次</text>

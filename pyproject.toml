[project]
name = "grounding-verifier"
version = "0.1.0"
description = "Citation grounding & faithfulness verifier: decomposes an LLM answer into atomic claims and verifies each against source passages with verbatim citations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.60",
    "typesafe-sdk>=0.3",
    "tenacity>=9.0",
    "tiktoken>=0.8",
    "spacy>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
